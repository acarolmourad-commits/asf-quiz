<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASF Quiz — Quiz do Dia de Surf</title>
<meta name="description" content="Quiz diário de conhecimento do surf: 5 perguntas, +15 XP e streak. Satélite do app ASF.">
<style>:root{--p:#00a8cc;--pd:#0e2439;--g:#f4d03f}*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:#f6fbfd;color:var(--pd)}nav{background:var(--pd);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:0}nav a{color:#fff;text-decoration:none;font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.08)}nav a:hover{background:var(--p)}nav a.hub{background:var(--g);color:var(--pd)}header{padding:40px 20px;text-align:center;background:linear-gradient(135deg,#f4d03f22,#00a8cc18)}h1{font-size:26px}main{max-width:560px;margin:24px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.07)}.streak{display:inline-block;background:#f4d03f33;border:1px solid #f4d03f66;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:600;color:#d4a017;margin-bottom:12px}.q{font-size:16px;font-weight:600;margin:10px 0}.opt{display:block;width:100%;text-align:left;padding:12px 14px;margin:6px 0;background:#fff;border:1.5px solid #dde;border-radius:10px;cursor:pointer;font-size:14px}.opt:hover{border-color:var(--p)}.opt.correct{background:#27ae6018;border-color:#27ae60;color:#27ae60}.opt.wrong{background:#e74c3c18;border-color:#e74c3c;color:#e74c3c}.res{display:none;margin-top:14px;padding:14px;border-radius:10px;text-align:center;font-weight:600}footer{text-align:center;padding:26px;font-size:12px;color:#678}button.next{margin-top:10px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border:none;border-radius:10px;padding:12px;width:100%;font-weight:600;cursor:pointer;display:none}</style>
</head>
<body>
<nav>
<a class="hub" href="https://acarolmourad-commits.github.io/asf-app/">🏄‍♀️ ASF App</a>
<a href="https://acarolmourad-commits.github.io/asf-previsao/">🌊 Previsão</a>
<a href="https://acarolmourad-commits.github.io/asf-praias/">🏖️ Praias</a>
<a href="https://acarolmourad-commits.github.io/asf-treino/">💪 Treino</a>
<a href="https://acarolmourad-commits.github.io/asf-eventos/">📅 Eventos</a>
<a href="https://acarolmourad-commits.github.io/asf-glossario/">📖 Glossário</a>
<a href="https://acarolmourad-commits.github.io/asf-comunidade/">💜 Comunidade</a>
<a href="https://acarolmourad-commits.github.io/asf-seguranca/">🛟 Segurança</a>
<a href="https://acarolmourad-commits.github.io/asf-equipamento/">🏄 Equipamento</a>
</nav>
<header><h1>🧠 ASF Quiz do Dia</h1><p>5 perguntas — responda para ganhar +15 XP 🎯</p></header>
<main><div class="card">
<span class="streak">🔥 <span id="streak">0</span> seguidos</span>
<p style="font-size:12px;font-weight:600;color:var(--p)" id="prog">Pergunta 1 de 5</p>
<p class="q" id="q"></p>
<div id="opts"></div>
<div class="res" id="res"></div>
<button class="next" id="next" onclick="nextQ()">Próxima ➜</button>
</div></main>
<footer>Parte da constelação ASF • <a href="https://acarolmourad-commits.github.io/asf-app/">Voltar ao app principal</a></footer>
<script>
const QS=[
{q:'Qual é a origem do surf?',o:['Polinésia','Brasil','Austrália','Califórnia'],a:0},
{q:'O que é uma corrente de retorno?',o:['Vento forte','Canal de água que volta ao mar','Onda gigante','Maré cheia'],a:1},
{q:'Quem tem prioridade na onda?',o:['Quem grita primeiro','Quem tem prancha maior','Quem está mais perto da arrebentação','Quem chegou por último'],a:2},
{q:'Qual o equipamento essencial de segurança?',o:['Leash (cordinha)','Óculos escuros','Boné','Cera colorida'],a:0},
{q:'O que fazer se pego por uma corrente?',o:['Nadar contra ela','Entrar em pânico','Nadar paralelo à praia','Mergulhar fundo'],a:2}
];
let i=0,score=0,done=false;
const st=parseInt(localStorage.getItem('asf-quiz-streak')||'0');
document.getElementById('streak').textContent=st;
function render(){
 document.getElementById('prog').textContent='Pergunta '+(i+1)+' de '+QS.length;
 document.getElementById('q').textContent=QS[i].q;
 const o=document.getElementById('opts');o.innerHTML='';
 QS[i].o.forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+k)+') '+t;b.onclick=()=>pick(b,k);o.appendChild(b)});
 document.getElementById('res').style.display='none';document.getElementById('next').style.display='none';
}
function pick(b,k){
 if(done)return;done=true;
 const ok=k===QS[i].a;const r=document.getElementById('res');
 document.querySelectorAll('.opt').forEach((el,j)=>{if(j===QS[i].a)el.classList.add('correct');else if(el===b)el.classList.add('wrong')});
 if(ok)score++;
 r.style.display='block';r.style.background=ok?'#27ae6018':'#e74c3c18';r.style.color=ok?'#27ae60':'#e74c3c';
 r.textContent=ok?'✅ Correto! +3 XP':'❌ Quase! A resposta certa está marcada.';
 const n=document.getElementById('next');n.style.display='block';
 n.textContent=i<QS.length-1?'Próxima ➜':'Ver resultado 🏁';
}
function nextQ(){
 done=false;
 if(i<QS.length-1){i++;render()}
 else{
  const ns=st+1;localStorage.setItem('asf-quiz-streak',ns);
  const xp=parseInt(localStorage.getItem('asf-quiz-xp')||'0')+score*3;localStorage.setItem('asf-quiz-xp',xp);
  document.getElementById('q').textContent='🏄‍♀️ Você acertou '+score+' de '+QS.length+'!';
  document.getElementById('opts').innerHTML='';document.getElementById('next').style.display='none';
  const r=document.getElementById('res');r.style.display='block';r.style.background='#f4d03f22';r.style.color='#d4a017';
  r.textContent='+'+(score*3)+' XP (total: '+xp+') • Streak: '+ns+' 🔥 Volte amanhã!';
  document.getElementById('streak').textContent=ns;document.getElementById('prog').textContent='Quiz completo!';
 }
}
render();
</script>
</body>
</html>
